apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-frontend-deployment
  namespace: retail-production
  labels:
    app: retail-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retail-frontend
  template:
    metadata:
      labels:
        app: retail-frontend
    spec:
      containers:
        - name: frontend
          image: registry.hub.docker.com/retailcapstone/inventory-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: retail-frontend-service
  namespace: retail-production
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: retail-frontend
