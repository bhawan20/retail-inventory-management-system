version: '3.8'

services:
  # ---------------------------------------------
  # Backend REST API Service
  # ---------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: devops/Dockerfile.backend
    container_name: retail-inventory-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=/app/data/retail_inventory.db
      - JWT_SECRET=retail-capstone-jwt-secret-2026
    volumes:
      - backend-data:/app/data
    networks:
      - retail-network

  # ---------------------------------------------
  # Frontend React SPA + Nginx Reverse Proxy
  # ---------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: devops/Dockerfile.frontend
    container_name: retail-inventory-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - retail-network

  # ---------------------------------------------
  # Optional PostgreSQL Enterprise Database
  # ---------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: retail-inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: retail_inventory
      POSTGRES_USER: retail_admin
      POSTGRES_PASSWORD: retail_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../backend/src/db/postgres_schema.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - retail-network

volumes:
  backend-data:
  pgdata:

networks:
  retail-network:
    driver: bridge
